name: Auto Merge Conflict Resolver

on:
  workflow_dispatch:
    inputs:
      branch_to_merge:
        description: 'マージ元のブランチ名 (子ブランチ)'
        required: true
        default: 'develop'
  pull_request:
    branches:
      - main 
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  resolve-and-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge with 'theirs' strategy
        run: |
          git fetch origin main ${{ github.head_ref }}
          git checkout main
          git merge -X theirs origin/${{ github.head_ref }}
          git push origin main
