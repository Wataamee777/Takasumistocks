<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Takasumi Stock Viewer</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <header class="top-bar">
        <button id="menuToggle" class="menu-toggle" type="button" aria-label="銘柄メニューを開く">☰ 会社切替</button>
        <div>
          <h1>Takasumi Stock Viewer</h1>
          <p>API: <code>GET https://api.takasumibot.com/v3/stock/</code></p>
        </div>
      </header>

      <aside id="drawer" class="drawer" aria-label="会社切替メニュー">
        <div class="drawer-head">
          <h2>会社一覧</h2>
          <button id="drawerClose" type="button" aria-label="閉じる">×</button>
        </div>
        <ul id="companyList" class="company-list"></ul>
      </aside>

      <section class="controls">
        <button id="refreshButton" type="button">今すぐ更新</button>
        <label>
          自動更新(秒):
          <input id="intervalInput" type="number" min="2" step="1" value="5" />
        </label>
        <button id="applyIntervalButton" type="button">適用</button>
      </section>

      <section>
        <h2>分析</h2>
        <div id="insightCards" class="insight-grid"></div>
        <h3>買い時候補（高値から下落）</h3>
        <ul id="buyCandidates"></ul>
        <h3>売り時候補（安値から上昇）</h3>
        <ul id="sellCandidates"></ul>
      </section>

      <section>
        <h2 id="selectedSymbolTitle">銘柄グラフ</h2>
        <canvas id="stockCanvas" width="900" height="300" aria-label="stock line chart"></canvas>
      </section>

      <section>
        <h2>選択中会社の推移</h2>
        <ul id="history"></ul>
      </section>

      <section>
        <h2>レスポンス</h2>
        <pre id="responseView">読み込み待機中...</pre>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
